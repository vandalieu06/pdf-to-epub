[project]
name = "pdf-to-epub"
version = "0.1.0"
description = "Convert light-novel PDFs to EPUB via an editable DOCX intermediate format"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pymupdf>=1.26.7",
    "pdf2docx>=0.5.13",
    "python-docx>=1.1.0",
    "ebooklib>=0.18",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
pdf-to-epub = "pdf_to_epub.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_to_epub"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/pdf_to_epub/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
